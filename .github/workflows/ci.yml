name: test-benchmark-build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Quality and latency benchmark
        run: python -m benchmarks.run_benchmark --cases 250 --seed 2026 --output artifacts/benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: artifacts/benchmark.json
      - name: Build production image
        run: docker build -t pt-zero:${{ github.sha }} .
